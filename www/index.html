<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BrainForce</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --bg:#050508;
  --surface:#0f0f14;
  --surface-hi:#18181f;
  --border:#1a1a22;
  --text:#c8ff00;
  --dim:#4a5a20;
  --accent:#c8ff00;
  --font:'Courier New','SF Mono',monospace;
}
[data-theme="green"] { --text:#00ff66; --accent:#00ff66; --dim:#1a5c33; }
[data-theme="amber"]{ --text:#ffaa00; --accent:#ffaa00; --dim:#664400; }
[data-theme="mist"] { --text:#88ccff; --accent:#88ccff; --dim:#335577; }

body {
  background:var(--bg); color:var(--text);
  font-family:var(--font); height:100vh; overflow:hidden;
  letter-spacing:3px; text-transform:uppercase; font-size:11px;
}

/* Status bar */
.status {
  background:#ccff00; color:#000;
  display:flex; justify-content:space-between; align-items:center;
  padding:6px 16px; font-size:10px; font-weight:bold; letter-spacing:2px;
}

/* Views */
.view { position:absolute; inset:0; display:flex; flex-direction:column; transition:transform .3s ease; }
#launcherView { transform:translateX(0); padding:16px; }
#settingsView { transform:translateX(100%); padding:16px; overflow-y:auto; }
#settingsView.open { transform:translateX(0); }

/* Launcher */
.launcher-header {
  display:flex; justify-content:space-between; align-items:flex-end;
  margin:16px 0 12px; padding-bottom:12px; border-bottom:1px solid var(--border);
}
.clock { font-size:28px; letter-spacing:4px; }
.date  { font-size:10px; color:var(--dim); margin-top:4px; }
.prefs-btn {
  background:var(--surface); border:1px solid var(--border);
  color:var(--text); padding:10px 14px; border-radius:10px;
  font-family:var(--font); font-size:10px; letter-spacing:2px; cursor:pointer;
}

.search {
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:14px 16px; color:var(--text); font-family:var(--font); font-size:12px;
  letter-spacing:2px; width:100%; margin-bottom:16px; outline:none;
}
.search::placeholder { color:var(--dim); }

.apps-grid {
  flex:1; overflow-y:auto;
  display:grid; grid-template-columns:repeat(4,1fr); gap:14px;
  padding-bottom:20px;
}
.app-item {
  display:flex; flex-direction:column; align-items:center;
  padding:12px 6px; border-radius:14px; background:var(--surface);
  border:1px solid var(--border); cursor:pointer; text-align:center;
}
.app-item:active { transform:scale(.95); background:var(--surface-hi); }
.app-icon {
  width:52px; height:52px; border-radius:14px; margin-bottom:8px;
  object-fit:cover; background:var(--surface-hi);
  display:flex; align-items:center; justify-content:center; font-size:22px;
}
.app-name { font-size:8px; letter-spacing:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:100%; }

/* Settings */
.section-title { color:var(--dim); font-size:10px; margin:24px 0 10px; letter-spacing:4px; }
.card {
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:16px; margin-bottom:10px; display:flex; justify-content:space-between;
  align-items:center; cursor:pointer;
}
.card-left { display:flex; align-items:center; gap:10px; }
.dot { width:18px; height:18px; border-radius:50%; box-shadow:0 0 8px currentColor; }
.selected { background:var(--surface-hi); border-color:var(--accent); }

.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:8px 16px; }
.stat-row { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border); }
.stat-row:last-child { border:none; }

.req-btn {
  border:1px solid var(--border); background:transparent; color:var(--text);
  padding:6px 12px; border-radius:8px; font-family:var(--font); font-size:10px; cursor:pointer;
}

.pixel {
  text-align:center; margin-top:30px; font-size:42px; line-height:1; filter: drop-shadow(0 0 6px var(--accent));
}
.brand {
  text-align:center; color:var(--dim); margin-top:10px; font-size:10px; letter-spacing:4px; margin-bottom:30px;
}

.empty { grid-column:1/-1; text-align:center; padding:50px 20px; color:var(--dim); }
.loading { grid-column:1/-1; text-align:center; padding:50px; color:var(--dim); }
</style>
</head>
<body data-theme="default">

<!-- LAUNCHER VIEW -->
<div class="view" id="launcherView">
  <div class="launcher-header">
    <div>
      <div class="clock" id="clock">00:00</div>
      <div class="date" id="date">---</div>
    </div>
    <button class="prefs-btn" onclick="openSettings()">PREFS</button>
  </div>
  <input type="text" class="search" id="search" placeholder="> SEARCH APPS" oninput="filterApps()">
  <div class="apps-grid" id="grid"><div class="loading">SCANNING...</div></div>
</div>

<!-- SETTINGS VIEW -->
<div class="view" id="settingsView">
  <div class="launcher-header" style="margin-top:0;">
    <div style="font-size:18px; letter-spacing:4px;">PREFERENCES</div>
    <button class="prefs-btn" onclick="closeSettings()">BACK</button>
  </div>

  <div class="section-title">THEME</div>
  <div class="card" id="t-default" onclick="setTheme('default')">
    <div class="card-left"><span style="margin-right:6px;">></span> CF - DEFAULT</div>
    <div class="dot" style="background:#c8ff00; color:#c8ff00;"></div>
  </div>
  <div class="card" id="t-green" onclick="setTheme('green')">
    <div class="card-left"><span style="margin-right:6px; opacity:0;">></span> GREEN</div>
    <div class="dot" style="background:#00ff66; color:#00ff66;"></div>
  </div>
  <div class="card" id="t-amber" onclick="setTheme('amber')">
    <div class="card-left"><span style="margin-right:6px; opacity:0;">></span> AMBER</div>
    <div class="dot" style="background:#ffaa00; color:#ffaa00;"></div>
  </div>
  <div class="card" id="t-mist" onclick="setTheme('mist')">
    <div class="card-left"><span style="margin-right:6px; opacity:0;">></span> MIST</div>
    <div class="dot" style="background:#88ccff; color:#88ccff;"></div>
  </div>

  <div class="section-title">PERMISSIONS</div>
  <div class="card" style="cursor:default;">
    <div>
      <div style="font-size:12px;">Notifications</div>
      <div style="font-size:9px; color:var(--dim); margin-top:2px; text-transform:none; letter-spacing:1px;">enable for tidy reminders</div>
    </div>
    <button class="req-btn" onclick="reqNotify()">REQUEST</button>
  </div>

  <div class="section-title">SESSION</div>
  <div class="stat-card">
    <div class="stat-row"><span>Energy</span><span>mid</span></div>
    <div class="stat-row"><span>Focus sessions</span><span>0</span></div>
    <div class="stat-row"><span>Vault entries</span><span>1</span></div>
    <div class="stat-row"><span>Brain dump</span><span>0 chars</span></div>
    <div class="stat-row"><span>Briefs saved</span><span>0</span></div>
  </div>

  <div class="pixel">👾</div>
  <div class="brand">CreativeFactory.studio</div>
</div>

<script>
let allApps=[];
let theme=localStorage.getItem('theme')||'default';
document.body.setAttribute('data-theme',theme);
updateThemeUI();

function updateClock(){
  const n=new Date();
  document.getElementById('clock').textContent=n.toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'});
  document.getElementById('date').textContent=n.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).toUpperCase();
}
setInterval(updateClock,1000); updateClock();

function openSettings(){ document.getElementById('settingsView').classList.add('open'); }
function closeSettings(){ document.getElementById('settingsView').classList.remove('open'); }

function setTheme(t){
  theme=t; localStorage.setItem('theme',t);
  document.body.setAttribute('data-theme',t);
  updateThemeUI();
}
function updateThemeUI(){
  ['default','green','amber','mist'].forEach(t=>{
    const el=document.getElementById('t-'+t);
    const arrow=el.querySelector('.card-left span');
    if(t===theme){ el.classList.add('selected'); arrow.style.opacity='1'; }
    else { el.classList.remove('selected'); arrow.style.opacity='0'; }
  });
}

async function loadApps(){
  const g=document.getElementById('grid');
  try{
    const r=await Capacitor.Plugins.AppLauncher.getApps();
    allApps=r.apps||[];
    render(allApps);
  }catch(e){
    g.innerHTML='<div class="empty">GRANT PERMISSIONS TO LIST APPS</div>';
  }
}
function render(apps){
  const g=document.getElementById('grid');
  if(!apps.length){ g.innerHTML='<div class="empty">NO APPS FOUND</div>'; return; }
  g.innerHTML=apps.map(a=>`
    <div class="app-item" onclick="launch('${a.package}','${a.activity}')">
      ${a.icon?`<img src="${a.icon}" class="app-icon">`:`<div class="app-icon">📱</div>`}
      <div class="app-name">${esc(a.name)}</div>
    </div>`).join('');
}
function filterApps(){
  const q=document.getElementById('search').value.toLowerCase();
  render(allApps.filter(a=>a.name.toLowerCase().includes(q)));
}
async function launch(pkg,act){
  try{ await Capacitor.Plugins.AppLauncher.launchApp({package:pkg,activity:act}); }
  catch(e){ console.error(e); }
}
function esc(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function reqNotify(){ alert('Request notification permission via Android Settings > Apps > BrainForce'); }

document.addEventListener('DOMContentLoaded',loadApps);
</script>
</body>
</html>
